[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool]

[tool.black]
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
include = '\.pyi?$'
line-length = 100
target-version = ['py36', 'py37', 'py38', 'py39']

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "pass",
  "pragma: no cover",
  "raise NotImplementedError",
  "raise TypeError",
  "raise ValueError"
]

[tool.isort]
known_local_folder = [
  'llm_baselines',
  'tests'
]
line_length = 100
profile = 'black'

[tool.poetry]
authors = ["Clinical Dream Team"]
description = "LLM baselines for clinical text conflict classification using zero-shot, one-shot, and few-shot prompting"
license = "Apache-2.0"
name = "llm-baselines"
readme = "README.md"
repository = "https://github.com/arkhn/open-nlp"
version = "0.1.0"

[tool.poetry.dependencies]
datasets = "^2.16.1"
groq = "^0.9.0"
httpx = ">=0.23.0,<0.25.0"
hydra-colorlog = "^1.2.0"
hydra-core = "^1.3.2"
hydra-joblib-launcher = "^1.2.0"
numpy = "^1.24.0"
pandas = "^2.2.0"
python = "~3.11"
rich = "^13.5.2"
scikit-learn = "^1.3.0"
tqdm = "^4.66.1"
wandb = "^0.16.3"

[tool.poetry.dev-dependencies]
pytest = "^7.4.2"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing:skip-covered"
markers = [
  "serial",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
