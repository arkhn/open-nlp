defaults:
  - _self_
  - override /hydra/sweeper: basic
  - override /hydra/launcher: basic

data:
  test_ratio: 0.2
  val_ratio: 0.1
  max_length: 512
  data_path: "processed/_12092025.json"

model:
  model_name_or_path: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  num_labels: 6

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  epochs: 10
  weight_decay: 0.01
  learning_rate: 2e-5
  push_to_hub: False
  eval_steps: 100
  logging_steps: 50
  warmup_steps: 100

logging:
  output_dir: "outputs"
  entity: "clinical-dream-team"
  project: "conflict-detection"
  tags: ["baseline", "conflict-classification"]

global_seed: 42
