defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

seed: 42

hydra:
  job:
    chdir: true

model:
  name: "openai/gpt-oss-120b"
  base_temperature: 0.7
  editor_temperature: 0.2
  max_length: 2000

pipeline:
  max_retries: 5
  dataset_size: 30
  early_exit_on_success: false

editor:
  max_retries: 5
  min_text_length: 20

validation:
  min_validation_score: 4

doctor:
  conflict_types:
    clinical_history:
      name: "Clinical History/Important Antecedents"
      description:
        "Conflicts between current clinical documentation and historical surgical/procedural events
        that should permanently alter patient status or clinical decision-making"
      examples:
        - "Surgical History Amnesia: Current Note: 'No prior abdominal surgery' CONTRADICTS Surgical
          Record (2 years ago): 'Laparoscopic cholecystectomy completed'"
        - "Transplant Status Conflicts: Primary Care Note: 'Healthy adult, no chronic medications'
          CONTRADICTS Transplant Record: 'Living donor kidney transplant, on tacrolimus'"
        - "Implant/Device Discrepancies: MRI Order: 'No contraindications' CONTRADICTS Surgical
          Record: 'Permanent pacemaker placed'"
        - "Anatomical Alteration Conflicts: Current Exam: 'Bowel sounds present all four quadrants'
          CONTRADICTS Surgical History: 'Total colectomy with ileostomy'"
    biological_markers:
      name: "Biological Marker Monitoring"
      description:
        "Conflicts in laboratory values, vital signs, or physiological measurements that are
        incompatible with documented procedures or expected post-procedural trajectories"
      examples:
        - "Post-Operative Trajectory Violations: Post-Op Day 1: 'Hemoglobin 7.2' CONTRADICTS Post-Op
          Day 2: 'Hemoglobin 11.5' [No transfusion documented]"
        - "Organ Function Paradoxes: Current Labs: 'Total bilirubin 0.8, direct bilirubin 0.2'
          CONTRADICTS History: 'Status post total hepatectomy pending transplant'"
        - "Immunological Marker Inconsistencies: Current: 'No HLA antibodies detected' CONTRADICTS
          History: 'Multiple pregnancy history, 20+ blood transfusions'"
        - "Procedural Marker Absence: Pre-cardiac cath: 'Troponin 0.02' CONTRADICTS Post-cardiac
          cath (with documented stent): 'Troponin 0.02'"
    care_evolution:
      name: "Pre- and Post-Care Evolution Conflicts"
      description:
        "Inconsistencies in clinical status, diagnoses, or treatment plans between care transition
        points that lack documented explanation or clinical justification"
      examples:
        - "Diagnosis Migration Without Justification: Admission: 'Acute myocardial infarction'
          CONTRADICTS Discharge: 'Gastroesophageal reflux' [No cardiac workup documented]"
        - "Unresolved Critical Findings: Admission: 'Lung mass identified on chest X-ray, needs
          follow-up' CONTRADICTS Discharge: 'Pneumonia resolved' [No mention of mass]"
        - "Medication Reconciliation Failures: Admission Meds: 'Warfarin 5mg daily for AFib'
          CONTRADICTS Discharge Meds: [No anticoagulation, no documented reason]"
        - "Functional Status Paradoxes: Admission: 'Bedbound, severe dementia' CONTRADICTS Discharge
          (3 days later): 'Ambulating independently, alert and oriented'"
        - "Symptom Resolution Without Treatment: ED Arrival: '10/10 chest pain, diaphoresis'
          CONTRADICTS Admission (2 hours later): 'Denies any symptoms' [No treatment given]"
    temporality:
      name: "Temporality"
      description:
        "Conflicts involving patient characteristics that should remain constant (immutable) or
        change predictably over time, particularly focusing on allergies and constitutional features"
      examples:
        - "Immutable Characteristic Mutations: 2020 Record: 'Blood type A+' CONTRADICTS 2024 Record:
          'Blood type O-'"
        - "Allergy Evolution Anomalies: 2022: 'Anaphylaxis to penicillin' CONTRADICTS 2023: 'No
          known drug allergies' CONTRADICTS 2024: 'Severe penicillin allergy'"
        - "Genetic Information Conflicts: Genetics Clinic: 'BRCA1 positive' CONTRADICTS Oncology
          Note: 'No genetic risk factors'"
        - "Constitutional Metric Impossibilities: Age 40 visit: 'Height 5'10'' CONTRADICTS Age 41
          visit: 'Height 6'2''"
        - "Chronic Condition Disappearance/Reappearance: 2021: 'Type 1 diabetes, on insulin'
          CONTRADICTS 2023: 'No history of diabetes' CONTRADICTS 2024: 'Diabetic, insulin-dependent'"

data:
  path: "data/mimic-iii-verifact-bhc.parquet"
