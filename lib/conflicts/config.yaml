defaults:
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

seed: 42

hydra:
  job:
    chdir: true

model:
  name: "openai/gpt-oss-120b"
  base_temperature: 0.7
  editor_temperature: 0.2
  max_length: 2000

pipeline:
  max_retries: 5
  dataset_size: 30
  early_exit_on_success: false
  top_k_per_subject: 5 # top-K docs per patient per conflict type → C(K,2) pairs each

editor:
  max_retries: 5
  min_text_length: 20

validation:
  min_validation_score: 4

data:
  path: "data/mimic-iii-verifact-bhc.parquet"
